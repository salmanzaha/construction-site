<!DOCTYPE html>
<html lang="fr">
 <head>
    <meta charset="UTF-8">
    <title>Mon E-commerce</title>
    <link rel="stylesheet" href="style.css">
 </head>

  <body>
    
    <!--Header-->
    <header>
      <h1>ShopOnline</h1>
      <nav>
         <a href="#">Accueil</a>
         <a href="#">Produits</a>
         <a href="#">Contact</a>
      </nav>
    </header>

    <!--Banniere-->
    <section class="hero">
      <h2>Bienvenue dans notre boutique</h2>
      <p>Les meilleurs produits au meilleur prix</p>
      <button>Acheter maintenant</button>
    </section>

    <!--produits-->
    <section class="products">
      <div class="product">
        <img src="images/product.jpg" alt="produit">
        <h3>Livre Digital</h3>
        <p>Guide complet pour apprendre efficacement.</p>
        <span>10 €</span>
        <button>Ajouter au panier</button>
      </div>

      <div class="product">
         <img src="images/service design.jpg" alt="service">
         <h3>Service Design</h3>
         <p>Création de logo professionnel.</p>
         <span>15 €</span>
         <button>Commander</button>
      </div>
    </section>

    <!--footer-->
    <footer>
       <p>© 2026 ShopOnline - Tous droits réservés</p>
    </footer>
  </body>
</html>
